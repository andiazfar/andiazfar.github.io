name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A user site (<name>.github.io) is served at the root; a project site under /<repo>.
      # Done in shell because an empty string is falsy in `a && '' || b` expressions.
      - name: Build
        run: |
          case "$REPO" in
            *.github.io) export PAGES_BASE_PATH="" ;;
            *) export PAGES_BASE_PATH="/$REPO" ;;
          esac
          npm run build
        env:
          REPO: ${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
